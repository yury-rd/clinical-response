name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements-repro.txt -e '.[dev]'
      - name: Check and test
        run: |
          ruff check .
          ruff format --check .
          python -m pytest -q
      - name: Build and verify installed wheel
        run: |
          python -m build
          python -m venv /tmp/clinical-wheel
          /tmp/clinical-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/clinical-wheel/bin/clinical-response --output demo.json
          /tmp/clinical-wheel/bin/python -c 'import json; d=json.load(open("demo.json")); assert d["phase_references"]==199'
